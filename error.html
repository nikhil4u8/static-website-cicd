<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
    }
    .card {
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .code { font-size: 96px; font-weight: 800; color: #ff9900; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #9aa0a6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #ff9900;
      color: #111;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
